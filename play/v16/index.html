<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>Grave Garden</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #e8e3ef; background-color: #120f17; overflow: hidden; touch-action: none; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #120f17; padding: 24px; text-align: center; }
#status h1 { margin: 0; color: #a6e36b; font-size: 2.4rem; }
#status-bar { width: min(320px, 80vw); height: 10px; border-radius: 6px; background: #2a2333; overflow: hidden; }
#status-fill { width: 0%; height: 100%; background: #a6e36b; transition: width .2s; }
#status-text { font-size: 1rem; color: #e8e3ef; min-height: 1.4em; }
#status-hint { font-size: .85rem; color: #a59fb0; max-width: 360px; }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Grave Garden needs JavaScript turned on.</noscript>
<div id="status">
  <h1>Grave Garden</h1>
  <div id="status-bar"><div id="status-fill"></div></div>
  <div id="status-text">Starting...</div>
  <div id="status-hint">The first visit downloads the game (about 10 MB), which can take a minute or two on a slow connection. After that it opens from your browser's cache.</div>
</div>

<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11657036,"index.wasm":26567346},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const overlay = document.getElementById('status');
	const fill = document.getElementById('status-fill');
	const text = document.getElementById('status-text');
	const hint = document.getElementById('status-hint');
	// Godot's default loader takes its total from the download's Content-Length. GitHub
	// Pages gzips the files, so that total is about a quarter of the real size and the
	// bar looked full straight away. Use the real file sizes from the export instead.
	const sizes = GODOT_CONFIG.fileSizes || {};
	const realTotal = Object.values(sizes).reduce(function (a, b) { return a + b; }, 0);
	const started = Date.now();
	let message = 'Starting...';
	let done = false;

	function render() {
		const secs = Math.round((Date.now() - started) / 1000);
		text.textContent = secs >= 10 ? message + ' (' + secs + 's)' : message;
	}

	function fail(err) {
		console.error(err);
		done = true;
		text.textContent = 'Could not start the game: ' + (err && err.message ? err.message : err);
		hint.textContent = 'Try reloading the page. If it keeps happening, try another browser.';
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fail('this browser is missing ' + missing.join(', '));
		return;
	}

	engine.startGame({
		onProgress: function (current) {
			if (done) return;
			const pct = realTotal > 0 ? Math.min(100, Math.floor((current / realTotal) * 100)) : 0;
			fill.style.width = pct + '%';
			message = pct < 100 ? 'Downloading the graveyard... ' + pct + '%' : 'Waking the dead...';
			render();
		},
	}).then(function () {
		done = true;
		overlay.remove();
	}, fail);

	const timer = setInterval(function () {
		if (done) { clearInterval(timer); return; }
		render();
	}, 1000);
}());
</script>
</body>
</html>
